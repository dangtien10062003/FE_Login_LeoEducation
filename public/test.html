<!DOCTYPE html>
<html>
<head><title>FE_Login Test</title></head>
<body style="font-family: sans-serif; padding: 20px; background: #1a1a2e; color: white;">
<h1>🔐 LeoEducation Auth Test</h1>
<pre id="output">Testing...</pre>
<script>
const output = document.getElementById('output');
const log = (msg) => { output.textContent += '\n' + msg; };

async function test() {
  try {
    // Test 1: Login
    log('1. Testing LOGIN...');
    const r = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({username:'admin@leoeducation.vn',password:'***'})
    });
    const j = await r.json();
    log('   Result: ' + JSON.stringify(j, null, 2).substring(0, 200));
    
    if (j.success) {
      localStorage.setItem('token', j.data.token);
      log('   ✅ Token saved to localStorage');
    }
    
    // Test 2: Get Me
    log('\n2. Testing GET ME...');
    const token = localStorage.getItem('token');
    const r2 = await fetch('/api/auth/me', {
      headers: { 'Authorization': `Bearer ${token}` }
    });
    const j2 = await r2.json();
    log('   Result: ' + JSON.stringify(j2, null, 2).substring(0, 200));
    
    log('\n3. Testing proxy through the configured FE_Login dev server...');
    log('   Open the FE_Login URL from VITE_DEV_SERVER_PORT');
    log('   Open the FE_Admin URL from VITE_ADMIN_URL');
    
  } catch(e) {
    log('ERROR: ' + e.message);
  }
}
test();
</script>
</body>
</html>
